<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Planet Stop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a0a1a;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Rotate device prompt for portrait mode */
    #rotate-prompt {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0a0a1a;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #rotate-prompt .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    #rotate-prompt h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #rotate-prompt p {
      font-size: 16px;
      color: #888;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-20deg); }
      75% { transform: rotate(20deg); }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt">
    <div class="icon">📱</div>
    <h2>Please Rotate Your Device</h2>
    <p>Planet Stop plays best in landscape mode</p>
  </div>
  <div id="game-container"></div>

  <script>
    // Fix for mobile viewport height (address bar)
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);

      // Update game container size
      const container = document.getElementById('game-container');
      if (container) {
        container.style.height = `${window.innerHeight}px`;
      }
    }

    // Handle orientation on mobile
    function checkOrientation() {
      const rotatePrompt = document.getElementById('rotate-prompt');
      const isMobile = window.innerWidth < 900 || window.innerHeight < 500;
      const isPortrait = window.innerHeight > window.innerWidth;

      if (isMobile && isPortrait) {
        rotatePrompt.style.display = 'flex';
      } else {
        rotatePrompt.style.display = 'none';
      }
    }

    // Initial setup
    setViewportHeight();
    checkOrientation();

    // Handle resize and orientation changes
    window.addEventListener('resize', () => {
      setViewportHeight();
      checkOrientation();
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        setViewportHeight();
        checkOrientation();
      }, 150);
    });

    // Trigger resize on scroll (helps when address bar hides)
    let lastHeight = window.innerHeight;
    setInterval(() => {
      if (window.innerHeight !== lastHeight) {
        lastHeight = window.innerHeight;
        setViewportHeight();
        window.dispatchEvent(new Event('resize'));
      }
    }, 250);
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
